<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperFrames Template Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d12;
      --surface: #16161f;
      --surface-raised: #1e1e2a;
      --border: #2a2a3a;
      --border-hover: #3d3d55;
      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --purple-dim: rgba(124, 58, 237, 0.15);
      --text: #e8e8f0;
      --text-muted: #7a7a98;
      --text-dim: #4a4a65;
      --green: #34d399;
      --yellow: #fbbf24;
      --blue: #60a5fa;
      --red: #f87171;
      --radius: 12px;
      --preview-w: 400px;
      --preview-h: 225px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    .site-header {
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: 0 40px;
    }
    .header-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 20px;
      height: 64px;
    }
    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--purple);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -0.03em;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }
    .header-count {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 20px;
    }
    .header-hint {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* ── ASPECT TOGGLE ── */
    .aspect-toggle {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 9px;
      flex-shrink: 0;
    }
    .aspect-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .aspect-btn:hover { color: var(--text); }
    .aspect-btn.active {
      background: var(--purple-dim);
      border-color: rgba(124,58,237,0.4);
      color: var(--purple-light);
    }
    .aspect-btn .ratio-glyph {
      border: 1.5px solid currentColor;
      border-radius: 2px;
      opacity: 0.8;
    }
    .aspect-btn[data-aspect="16x9"] .ratio-glyph { width: 16px; height: 9px; }
    .aspect-btn[data-aspect="9x16"] .ratio-glyph { width: 9px; height: 16px; }
    .aspect-btn .count { opacity: 0.5; font-weight: 400; }

    /* ── CONTROLS ── */
    .controls {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13,13,18,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 40px;
    }
    .controls-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 340px;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px 8px 36px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { border-color: var(--purple); }

    .tabs {
      display: flex;
      gap: 4px;
    }
    .tab {
      padding: 7px 14px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { color: var(--text); background: var(--surface-raised); }
    .tab.active {
      background: var(--purple-dim);
      border-color: rgba(124,58,237,0.4);
      color: var(--purple-light);
    }

    .results-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* ── MAIN GRID ── */
    .main {
      padding: 32px 40px 60px;
      max-width: 1600px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
      margin-top: 36px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .section-label:first-child { margin-top: 0; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 20px;
    }
    .grid.portrait {
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    }
    /* Narrow portrait cards: let the footer wrap instead of squeezing each control */
    .grid.portrait .card-footer {
      flex-wrap: wrap;
      gap: 6px 8px;
    }
    .grid.portrait .open-link { white-space: nowrap; }
    .grid.portrait .copy-path {
      margin-left: 0;
      max-width: 100%;
    }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* ── PREVIEW ── */
    .preview-outer {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      cursor: pointer;
      flex-shrink: 0;
    }
    .preview-outer.portrait { aspect-ratio: 9 / 16; }
    .preview-outer.overlay-bg {
      background-color: #0a0a0f;
      background-image: url('Assets/templates/assets/talking-head-placeholder.png');
      background-position: center;
      background-size: cover;
    }
    .preview-outer.video-bg {
      background: #0a0a0f;
    }

    .preview-scaler {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--frame-w, 1920px);
      height: var(--frame-h, 1080px);
      transform-origin: top left;
      pointer-events: none;
    }

    .preview-scaler iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--frame-w, 1920px);
      height: var(--frame-h, 1080px);
      border: none;
      background: transparent;
    }

    .preview-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-dim);
      font-size: 12px;
    }
    .preview-placeholder svg { opacity: 0.3; }

    .preview-controls {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      transition: background 0.2s;
    }
    .preview-outer:hover .preview-controls {
      background: rgba(0,0,0,0.35);
    }
    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.45);
      border: 1.5px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: scale(0.85);
      transition: all 0.18s;
      backdrop-filter: blur(6px);
    }
    .preview-outer:hover .play-btn {
      opacity: 1;
      transform: scale(1);
    }
    .play-btn:hover {
      background: var(--purple);
      border-color: var(--purple);
      color: #fff;
      transform: scale(1.1) !important;
    }

    .duration-pill {
      position: absolute;
      bottom: 8px;
      right: 10px;
      background: rgba(0,0,0,0.65);
      color: rgba(255,255,255,0.8);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    /* ── CARD BODY ── */
    .card-body {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid;
    }
    .badge-mg {
      color: #c4b5fd;
      background: rgba(167,139,250,0.1);
      border-color: rgba(167,139,250,0.25);
    }
    .badge-template {
      color: #93c5fd;
      background: rgba(96,165,250,0.1);
      border-color: rgba(96,165,250,0.25);
    }
    .badge-news {
      color: #fcd34d;
      background: rgba(251,191,36,0.1);
      border-color: rgba(251,191,36,0.25);
    }
    .badge-standalone {
      color: #6ee7b7;
      background: rgba(52,211,153,0.08);
      border-color: rgba(52,211,153,0.2);
    }
    .badge-overlay {
      color: #fda4af;
      background: rgba(248,113,113,0.08);
      border-color: rgba(248,113,113,0.2);
    }
    .badge-video {
      color: #93c5fd;
      background: rgba(96,165,250,0.08);
      border-color: rgba(96,165,250,0.2);
    }

    .card-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .open-link {
      font-size: 12px;
      color: var(--purple-light);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color 0.15s;
    }
    .open-link:hover { color: #fff; }
    .copy-path {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-dim);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'SF Mono', Menlo, monospace;
      transition: all 0.15s;
      white-space: nowrap;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .copy-path:hover {
      border-color: var(--purple);
      color: var(--text-muted);
    }
    .copy-path.copied {
      color: var(--green);
      border-color: rgba(52,211,153,0.4);
    }
    .sfx-preview-btn {
      font-size: 11px;
      font-weight: 600;
      color: var(--purple-light);
      background: var(--purple-dim);
      border: 1px solid rgba(124,58,237,0.4);
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .sfx-preview-btn:hover:not(:disabled) {
      color: #fff;
      background: var(--purple);
      border-color: var(--purple);
    }
    .sfx-preview-btn.playing {
      color: var(--green);
      border-color: rgba(52,211,153,0.45);
      background: rgba(52,211,153,0.08);
    }
    .sfx-preview-btn:disabled {
      color: var(--text-dim);
      background: var(--surface-raised);
      border-color: var(--border);
      cursor: default;
      opacity: 0.7;
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-dim);
    }
    .empty-state svg { margin-bottom: 16px; opacity: 0.3; }
    .empty-state p { font-size: 15px; }

    /* ── HIDDEN ── */
    .card.hidden { display: none; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-mark">HF</div>
    <span class="header-title">Template Library</span>
    <span class="header-count" id="total-count">0 templates</span>
    <span class="header-hint">Animations auto-play as you scroll · Shift+click to open full size</span>
    <div class="aspect-toggle" id="aspect-toggle">
      <button class="aspect-btn active" data-aspect="16x9" title="Show landscape templates (1920×1080)">
        <span class="ratio-glyph"></span>16:9<span class="count" id="aspect-count-16x9"></span>
      </button>
      <button class="aspect-btn" data-aspect="9x16" title="Show vertical templates (1080×1920)">
        <span class="ratio-glyph"></span>9:16<span class="count" id="aspect-count-9x16"></span>
      </button>
    </div>
  </div>
</header>

<div class="controls">
  <div class="controls-inner">
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input class="search-input" type="text" placeholder="Search templates…" id="search" autocomplete="off">
    </div>
    <div class="tabs">
      <button class="tab active" data-filter="all">All <span style="opacity:0.5;font-weight:400">0</span></button>
      <button class="tab" data-filter="template">Templates <span style="opacity:0.5;font-weight:400">0</span></button>
      <button class="tab" data-filter="mg">Motion Graphics <span style="opacity:0.5;font-weight:400">0</span></button>
      <button class="tab" data-filter="news">News Scenes <span style="opacity:0.5;font-weight:400">0</span></button>
    </div>
    <span class="results-count" id="results-count"></span>
  </div>
</div>

<main class="main" id="main"></main>

<script>
const TEMPLATES = [
  // ── TEMPLATES (mograph-remix inserts entries below this line) ──
];

// ── RENDER ──────────────────────────────────────────────────────────────────

function mediaBadgeHtml(mode) {
  if (mode === 'video')      return '<span class="badge badge-video">Video Overlay</span>';
  if (mode === 'overlay')    return '<span class="badge badge-overlay">Overlay Only</span>';
  if (mode === 'standalone') return '<span class="badge badge-standalone">Standalone</span>';
  return '';
}

function categoryBadgeHtml(cat) {
  if (cat === 'template') return '<span class="badge badge-template">Template</span>';
  if (cat === 'mg')       return '<span class="badge badge-mg">Motion Graphic</span>';
  if (cat === 'news')     return '<span class="badge badge-news">News Scene</span>';
  return '';
}

function durationLabel(d) {
  if (!d) return '';
  return d + 's';
}

// Templates are 16:9 (1920×1080) unless they declare `aspect: '9x16'`.
const FRAME_SIZES = { '16x9': [1920, 1080], '9x16': [1080, 1920] };
function aspectOf(t) { return t.aspect === '9x16' ? '9x16' : '16x9'; }

function makeCard(t) {
  const isOverlay = t.mediaMode === 'overlay';
  const isVideo   = t.mediaMode === 'video';
  const isPortrait = aspectOf(t) === '9x16';
  const [frameW, frameH] = FRAME_SIZES[aspectOf(t)];
  const previewClass = (isOverlay ? 'preview-outer overlay-bg' : isVideo ? 'preview-outer video-bg' : 'preview-outer')
    + (isPortrait ? ' portrait' : '');
  const dur = t.duration ? `<span class="duration-pill">${durationLabel(t.duration)}</span>` : '';
  const fileName = t.path.split('/').pop();
  const sfxCount = Array.isArray(t.soundEffects) ? t.soundEffects.length : 0;
  const sfxButton = sfxCount
    ? `<button class="sfx-preview-btn" id="sfx-${t.id}" onclick="previewSfx(event, '${t.id}')" title="Restart animation and preview assigned sound effects">🔊 Preview SFX (${sfxCount})</button>`
    : `<button class="sfx-preview-btn" disabled title="Add soundEffects metadata to this template first">No SFX assigned</button>`;

  return `
<div class="card" data-id="${t.id}" data-cat="${t.category}" data-aspect="${aspectOf(t)}">
  <div class="${previewClass}" id="preview-${t.id}" onclick="handlePreviewClick(event, '${t.id}')">
    <div class="preview-scaler" id="scaler-${t.id}" style="--frame-w:${frameW}px; --frame-h:${frameH}px">
      <iframe
        data-src="${t.path}"
        id="iframe-${t.id}"
        title="${t.name}"
        scrolling="no"
        sandbox="allow-scripts allow-same-origin"
      ></iframe>
    </div>
    <div class="preview-controls">
      <button class="play-btn" id="play-${t.id}" title="Restart animation" aria-label="Restart ${t.name}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      </button>
    </div>
    ${dur}
  </div>
  <div class="card-body">
    <div class="card-name">${t.name}</div>
    <div class="badges">
      ${categoryBadgeHtml(t.category)}
      ${mediaBadgeHtml(t.mediaMode)}
    </div>
    <p class="card-desc">${t.desc}</p>
    <div class="card-footer">
      ${sfxButton}
      <a class="open-link" href="${t.path}" target="_blank" title="Open full size in new tab">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open Full Size
      </a>
      <button class="copy-path" id="copy-${t.id}" onclick="copyPath(event, '${t.id}', '${t.path}')" title="Copy path">${fileName}</button>
    </div>
  </div>
</div>`;
}

function buildGrid(filtered) {
  const main = document.getElementById('main');
  main.innerHTML = '';

  const inAspect = TEMPLATES.filter(t => aspectOf(t) === currentAspect);

  if (filtered.length === 0) {
    const noneInAspect = inAspect.length === 0;
    main.innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <p>${noneInAspect
          ? `No ${currentAspect === '9x16' ? '9:16 vertical' : '16:9 landscape'} templates yet.`
          : 'No templates match your search.'}</p>
      </div>`;
    document.getElementById('results-count').textContent = '';
    return;
  }

  const groups = [
    { key: 'template', label: 'Templates' },
    { key: 'mg',       label: 'Motion Graphics' },
    { key: 'news',     label: 'News Scenes' },
  ];

  const activeFilter = document.querySelector('.tab.active')?.dataset.filter || 'all';
  const gridClass = currentAspect === '9x16' ? 'grid portrait' : 'grid';

  let html = '';
  groups.forEach(({ key, label }) => {
    const group = filtered.filter(t => t.category === key);
    if (group.length === 0) return;
    const showSection = activeFilter === 'all' || filtered.length < inAspect.length;
    if (showSection) {
      html += `<div class="section-label">${label} — ${group.length}</div>`;
    }
    html += `<div class="${gridClass}">`;
    group.forEach(t => { html += makeCard(t); });
    html += `</div>`;
  });

  main.innerHTML = html;
  document.getElementById('results-count').textContent =
    filtered.length < inAspect.length ? `${filtered.length} results` : '';

  scaleAllPreviews();
  setupLazyLoad();
}

// ── PREVIEW SCALING ──────────────────────────────────────────────────────────

function scaleAllPreviews() {
  document.querySelectorAll('.preview-outer').forEach(outer => {
    const scaler = outer.querySelector('.preview-scaler');
    if (!scaler) return;
    const w = outer.clientWidth;
    if (!w) return;
    const [frameW, frameH] = FRAME_SIZES[outer.classList.contains('portrait') ? '9x16' : '16x9'];
    const scale = w / frameW;
    scaler.style.transform = `scale(${scale})`;
    outer.style.height = (frameH * scale) + 'px';
  });
}

window.addEventListener('resize', scaleAllPreviews);

// ── LAZY LOAD IFRAMES ────────────────────────────────────────────────────────
// Templates handle their own auto-play and looping via the injected hf-autoplay
// script. The library just needs to set iframe.src when a card enters the viewport.

let loadObserver;

function setupLazyLoad() {
  if (loadObserver) loadObserver.disconnect();
  loadObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      const iframe = entry.target;
      if (!iframe.src && iframe.dataset.src) {
        iframe.src = iframe.dataset.src;
      }
      loadObserver.unobserve(iframe);
    });
  }, { rootMargin: '400px' });

  document.querySelectorAll('iframe[data-src]').forEach(iframe => {
    loadObserver.observe(iframe);
  });
}

// ── CLICK: RESTART ────────────────────────────────────────────────────────────

function handlePreviewClick(event, id) {
  if (event.shiftKey) {
    const t = TEMPLATES.find(t => t.id === id);
    if (t) window.open(t.path, '_blank');
    return;
  }
  // Reload the iframe to restart the animation from the top
  const iframe = document.getElementById('iframe-' + id);
  if (!iframe) return;
  if (!iframe.src && iframe.dataset.src) {
    iframe.src = iframe.dataset.src;
  } else if (iframe.src) {
    const src = iframe.src;
    iframe.src = '';
    requestAnimationFrame(() => { iframe.src = src; });
  }
}

// ── OPT-IN SFX PREVIEW ──────────────────────────────────────────────────────
// Add `soundEffects` to a template entry using this shape:
// [{ src: 'assets/sfx/subtle woosh.mp3', offset: 0.2, volume: 0.3 }]
// Sounds never autoplay; they only play after the Preview SFX button is clicked.

let activeSfxPreview = { timers: [], audio: [], button: null };

function stopSfxPreview() {
  activeSfxPreview.timers.forEach(clearTimeout);
  activeSfxPreview.audio.forEach(audio => {
    audio.pause();
    audio.currentTime = 0;
  });
  activeSfxPreview.button?.classList.remove('playing');
  activeSfxPreview = { timers: [], audio: [], button: null };
}

function sfxAssetPath(src) {
  if (/^(?:https?:|file:|\/)/.test(src)) return src;
  if (src.startsWith('Assets/')) return src;
  return 'Assets/templates/' + src.replace(/^\.\//, '');
}

function restartPreview(id, onReady) {
  const iframe = document.getElementById('iframe-' + id);
  if (!iframe) return;
  iframe.addEventListener('load', onReady, { once: true });
  const src = iframe.src || iframe.dataset.src;
  if (!src) return;
  iframe.src = '';
  requestAnimationFrame(() => { iframe.src = src; });
}

function previewSfx(event, id) {
  event.stopPropagation();
  const template = TEMPLATES.find(t => t.id === id);
  const effects = template?.soundEffects || [];
  if (!effects.length) return;

  stopSfxPreview();
  const button = document.getElementById('sfx-' + id);
  activeSfxPreview.button = button;
  button?.classList.add('playing');

  restartPreview(id, () => {
    effects.forEach(effect => {
      const audio = new Audio(sfxAssetPath(effect.src));
      audio.preload = 'auto';
      audio.volume = Math.max(0, Math.min(1, Number(effect.volume ?? 0.35)));
      activeSfxPreview.audio.push(audio);
      const timer = setTimeout(() => {
        audio.play().catch(() => {
          button?.classList.remove('playing');
          button.title = 'Browser blocked playback. Click Preview SFX again.';
        });
      }, Math.max(0, Number(effect.offset || 0)) * 1000);
      activeSfxPreview.timers.push(timer);
    });

    const endAt = Math.max(...effects.map(effect => Number(effect.offset || 0)), 0) + 3;
    activeSfxPreview.timers.push(setTimeout(() => button?.classList.remove('playing'), endAt * 1000));
  });
}

// ── COPY PATH ────────────────────────────────────────────────────────────────

function copyPath(event, id, path) {
  event.stopPropagation();
  navigator.clipboard.writeText(path).then(() => {
    const btn = document.getElementById('copy-' + id);
    const prev = btn.textContent;
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = prev;
      btn.classList.remove('copied');
    }, 1800);
  });
}

// ── FILTER + SEARCH ──────────────────────────────────────────────────────────

let currentFilter = 'all';
let currentSearch = '';
let currentAspect = '16x9';

function getFiltered() {
  return TEMPLATES.filter(t => {
    if (aspectOf(t) !== currentAspect) return false;
    const catMatch = currentFilter === 'all' || t.category === currentFilter;
    const q = currentSearch.toLowerCase();
    const searchMatch = !q ||
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      t.id.toLowerCase().includes(q) ||
      t.features.some(f => f.toLowerCase().includes(q));
    return catMatch && searchMatch;
  });
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    buildGrid(getFiltered());
  });
});

document.getElementById('search').addEventListener('input', (e) => {
  currentSearch = e.target.value;
  buildGrid(getFiltered());
});

// ── ASPECT TOGGLE ────────────────────────────────────────────────────────────

function updateCounts() {
  const inAspect = TEMPLATES.filter(t => aspectOf(t) === currentAspect);
  const countFor = key => inAspect.filter(t => t.category === key).length;

  document.getElementById('total-count').textContent =
    `${inAspect.length} template${inAspect.length === 1 ? '' : 's'}`;

  const labels = { all: 'All', template: 'Templates', mg: 'Motion Graphics', news: 'News Scenes' };
  document.querySelectorAll('.tab').forEach(tab => {
    const key = tab.dataset.filter;
    const n = key === 'all' ? inAspect.length : countFor(key);
    tab.innerHTML = `${labels[key]} <span style="opacity:0.5;font-weight:400">${n}</span>`;
  });

  Object.keys(FRAME_SIZES).forEach(a => {
    document.getElementById('aspect-count-' + a).textContent =
      ' ' + TEMPLATES.filter(t => aspectOf(t) === a).length;
  });
}

document.querySelectorAll('.aspect-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.dataset.aspect === currentAspect) return;
    document.querySelectorAll('.aspect-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAspect = btn.dataset.aspect;
    stopSfxPreview();
    updateCounts();
    buildGrid(getFiltered());
  });
});

// ── INIT ─────────────────────────────────────────────────────────────────────

updateCounts();
buildGrid(getFiltered());
</script>
